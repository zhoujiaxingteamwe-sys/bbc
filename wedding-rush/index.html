<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#190914">
<title>新郎冲冲冲：婚礼倒计时</title>
<style>
:root {
  --bg: #170812;
  --panel: rgba(31, 9, 24, .78);
  --panel-strong: rgba(40, 10, 31, .92);
  --gold: #ffd36a;
  --pink: #ff75a8;
  --red: #ff4d6d;
  --text: #fff7f9;
  --muted: rgba(255, 247, 249, .72);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 20% 10%, rgba(255, 117, 168, .28), transparent 28%),
    radial-gradient(circle at 80% 90%, rgba(255, 211, 106, .18), transparent 30%),
    linear-gradient(135deg, #130710, #2a0f25 48%, #491729);
  touch-action: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}
.game-page {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(8px, var(--safe-top)) 8px max(8px, var(--safe-bottom));
}
.game-shell {
  position: relative;
  width: min(100vw, 177.777vh);
  height: min(56.25vw, 100vh);
  max-width: 1280px;
  max-height: 720px;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 28px 90px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255,255,255,.16);
  background: #000;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  background: #5ac7ff;
}
.success-video {
  position: absolute;
  inset: 0;
  display: none;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
  z-index: 4;
}
.success-video.show { display: block; }
.screen-overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px;
  background: linear-gradient(90deg, rgba(22, 5, 16, .68), rgba(22, 5, 16, .08), rgba(22, 5, 16, .68));
  pointer-events: none;
}
.screen-overlay.show { display: flex; }
.menu-card {
  width: min(520px, 92%);
  padding: 26px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 24px;
  background: var(--panel);
  box-shadow: 0 20px 60px rgba(0,0,0,.36);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  pointer-events: auto;
}
.menu-card h1 {
  font-size: clamp(28px, 5vw, 46px);
  line-height: 1.05;
  letter-spacing: -1px;
  color: #fff;
  text-shadow: 0 4px 18px rgba(255, 77, 109, .7);
}
.menu-card .tagline {
  margin-top: 10px;
  color: var(--gold);
  font-weight: 700;
  font-size: 16px;
}
.menu-card p {
  margin-top: 14px;
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
}
.button-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.game-btn {
  border: 0;
  border-radius: 999px;
  padding: 13px 22px;
  color: #3b0c16;
  font-weight: 900;
  font-size: 15px;
  cursor: pointer;
  background: linear-gradient(135deg, #fff5b8, var(--gold));
  box-shadow: 0 10px 24px rgba(255, 211, 106, .32);
}
.game-btn.secondary {
  color: #fff;
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.2);
  box-shadow: none;
}
.game-btn:active { transform: translateY(1px) scale(.98); }
.chapter-list {
  margin-top: 18px;
  display: grid;
  gap: 10px;
}
.chapter-card {
  width: 100%;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 18px;
  padding: 14px 16px;
  text-align: left;
  color: #fff;
  background: rgba(255,255,255,.1);
  cursor: pointer;
}
.chapter-card strong { display: block; color: var(--gold); font-size: 16px; }
.chapter-card span { display: block; margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.45; }
.chapter-card.locked { cursor: default; opacity: .62; }
.tips {
  margin-top: 16px;
  display: grid;
  gap: 8px;
  color: rgba(255,255,255,.76);
  font-size: 13px;
}
.touch-controls {
  position: absolute;
  inset: auto 0 calc(14px + var(--safe-bottom)) 0;
  display: none;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 24px;
  pointer-events: none;
}
.touch-controls.show { display: flex; }
.touch-group { display: flex; gap: 14px; pointer-events: auto; }
.touch-btn {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.28);
  color: #fff;
  font-weight: 900;
  font-size: 15px;
  background: rgba(44, 11, 35, .54);
  box-shadow: 0 12px 36px rgba(0,0,0,.3), inset 0 0 20px rgba(255,255,255,.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.touch-btn.primary {
  background: linear-gradient(135deg, rgba(255, 77, 109, .86), rgba(255, 117, 168, .68));
}
.touch-btn:active, .touch-btn.active { transform: scale(.95); filter: brightness(1.14); }
.corner-note {
  position: absolute;
  right: 14px;
  top: 12px;
  padding: 7px 10px;
  border-radius: 999px;
  background: rgba(0,0,0,.28);
  color: rgba(255,255,255,.78);
  font-size: 12px;
  pointer-events: none;
}
@media (max-width: 740px) {
  .game-shell { border-radius: 0; width: 100vw; height: 56.25vw; max-height: 100vh; }
  .game-page { padding: 0; }
  .menu-card { padding: 20px; }
  .touch-btn { width: 66px; height: 66px; }
  .touch-controls { padding: 0 14px; }
}
@media (orientation: portrait) and (max-width: 760px) {
  .game-shell { transform: translateY(-3vh); }
  .touch-controls { bottom: calc(10px + var(--safe-bottom)); }
}
</style>
</head>

  function r(sx, sy, sw, sh) { return { sx, sy, sw, sh }; }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function choose(arr, t, fps = 8) { return arr[Math.floor(t * fps) % arr.length]; }
  function img(name) { return images[name]; }
  function currentChapter() { return chapters[game.currentChapterId] || chapters.chapter1; }
  function isChapterOne() { return currentChapter().id === 'chapter1'; }
  function isChapterTwo() { return currentChapter().id === 'chapter2'; }

  function currentGroomOutfitKey() {
    if (!isChapterTwo()) return 'groom';
    const scene = currentSceneInfo();
    if (scene.id === 'disney') return 'groomCh2Disney';
    if (scene.id === 'universal') return 'groomCh2Universal';
    if (scene.id === 'grandcanal') return 'groomCh2GrandCanal';
    return 'groomCh2HkMacau';
  }

  function updateOutfitTransition(dt) {
    const key = currentGroomOutfitKey();
    if (key !== game.currentOutfitKey) {
      game.previousOutfitKey = game.currentOutfitKey;
      game.currentOutfitKey = key;
      game.outfitTransitionTime = game.outfitTransitionDuration;
    }
    game.outfitTransitionTime = Math.max(0, game.outfitTransitionTime - dt);
  }

  function ensureMusicEnabled() {
    music.enabled = true;
    if (game.mode === 'playing') updateMusic(0);
  }

  function stopMusic() {
    for (const audio of [music.current, music.pending]) {
      if (!audio) continue;
      audio.pause();
      audio.volume = 0;
    }
    music.current = null;
    music.pending = null;
    music.currentSceneId = null;
    music.fadeTime = 0;
  }

  function createMusicAudio(track) {
    const audio = new Audio(track.src);
    audio.loop = false;
    audio.preload = 'auto';
    audio.volume = 0;
    audio.currentTime = track.start;
    audio.dataset.start = String(track.start);
    audio.dataset.end = String(track.end);
    audio.addEventListener('timeupdate', () => {
      const end = Number(audio.dataset.end) || 0;
      const start = Number(audio.dataset.start) || 0;
      if (end && audio.currentTime >= end) audio.currentTime = start;
    });
    return audio;
  }

  function switchChapter2Music(sceneId) {
    const track = chapter2MusicTracks[sceneId];
    if (!track) {
      stopMusic();
      return;
    }
    if (music.currentSceneId === sceneId) return;
    const next = createMusicAudio(track);
    music.pending = next;
    music.currentSceneId = sceneId;
    music.fadeTime = 0;
    next.play().catch(() => {});
  }

  function updateMusic(dt) {
    if (!music.enabled) return;
    if (game.mode !== 'playing' || !isChapterTwo() || game.ceremony) {
      stopMusic();
      return;
    }
    switchChapter2Music(currentSceneInfo().id);
    if (!music.pending) {
      if (music.current) music.current.volume = music.volume;
      return;
    }
    music.fadeTime = Math.min(music.fadeDuration, music.fadeTime + dt);
    const t = music.fadeDuration ? music.fadeTime / music.fadeDuration : 1;
    if (music.current) music.current.volume = music.volume * (1 - t);
    music.pending.volume = music.volume * t;
    if (t >= 1) {
      if (music.current) music.current.pause();
      music.current = music.pending;
      music.pending = null;
    }
  }

  function loadAssets() {
    const entries = Object.entries({ ...manifest, ...ceremonyManifest });
    const progress = Object.fromEntries(entries.map(([name]) => [name, 0]));
    game.loadProgress = 0;
    updateOverlay();

    const onProgress = (name, value) => {
      progress[name] = Math.max(progress[name] || 0, value);
      const total = Object.values(progress).reduce((sum, item) => sum + item, 0);
      game.loadProgress = total / entries.length;
      updateOverlay();
    };

    Promise.all(entries.map(([name, src]) => loadImage(name, src, value => onProgress(name, value)).then(() => {
      onProgress(name, 1);
    }))).then(() => {
      game.ceremonyAssetsStarted = true;
      game.ceremonyAssetsReady = true;
      game.mode = 'menu';
      updateOverlay();
    });
  }

  function loadImage(name, src, onProgress) {
    if (!src) return Promise.resolve(null);
    if (images[name] !== undefined) {
      onProgress?.(1);
      return Promise.resolve(images[name]);
    }
    if (game.assetPromises[name]) return game.assetPromises[name].then(image => {
      onProgress?.(1);
      return image;
    });

    const decodeImage = blob => new Promise(resolve => {
      const image = new Image();
      const url = URL.createObjectURL(blob);
      image.onload = () => {
        URL.revokeObjectURL(url);
        images[name] = image;
        onProgress?.(1);
        resolve(image);
      };
      image.onerror = () => {
        URL.revokeObjectURL(url);
        console.warn('素材解码失败:', src);
        images[name] = null;
        onProgress?.(1);
        resolve(null);
      };
      image.src = url;
    });

    game.assetPromises[name] = fetch(src)
      .then(response => {
        if (!response.ok) throw new Error(`${response.status} ${src}`);
        const total = Number(response.headers.get('content-length')) || 0;
        if (!response.body || !total) return response.blob();
        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;
        return reader.read().then(function pump(result) {
          if (result.done) return new Blob(chunks);
          chunks.push(result.value);
          received += result.value.length;
          onProgress?.(Math.min(.98, received / total));
          return reader.read().then(pump);
        });
      })
      .then(decodeImage)
      .catch(error => {
        console.warn('素材加载失败:', src, error);
        images[name] = null;
        onProgress?.(1);
        return null;
      });
    return game.assetPromises[name];
  }

  function loadCeremonyAssets() {
    if (game.ceremonyAssetsReady) return Promise.resolve();
    if (game.ceremonyAssetsStarted) return game.assetPromises.__ceremony || Promise.resolve();
    game.ceremonyAssetsStarted = true;
    game.assetPromises.__ceremony = Promise.all(Object.entries(ceremonyManifest).map(([name, src]) => loadImage(name, src))).then(() => {
      game.ceremonyAssetsReady = true;
    });
    return game.assetPromises.__ceremony;
  }

  overlay.addEventListener('click', event => {

  window.addEventListener('keydown', event => {
    ensureMusicEnabled();
    const code = event.code;
    keys[code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(code)) event.preventDefault();
    if (code === 'Enter' && ['menu', 'win', 'gameOver'].includes(game.mode)) startGame(game.currentChapterId);
    if (code === 'KeyP' && game.mode === 'playing') setMode('paused');
    else if (code === 'KeyP' && game.mode === 'paused') setMode('playing');
  }, { passive: false });

  window.addEventListener('keyup', event => { keys[event.code] = false; });

  document.querySelectorAll('[data-touch]').forEach(button => {
    const name = button.dataset.touch;
    const on = event => {
      event.preventDefault();
      touch[name] = true;
      button.classList.add('active');
      if (name === 'jump') requestJump();
      if (name === 'throw') throwCandy();
    };
    const off = event => {
      event.preventDefault();
      touch[name] = false;
      button.classList.remove('active');
    };
    button.addEventListener('pointerdown', on);
    button.addEventListener('pointerup', off);
    button.addEventListener('pointercancel', off);
    button.addEventListener('pointerleave', off);
  });

  function update(dt) {
    updateMusic(dt);
    if (game.mode !== 'playing') return;

    const chapter = currentChapter();
    if (game.ceremony) {
      game.storyTimer = Math.max(0, game.storyTimer - dt);
      player.animTime += dt;
      game.screenShake = Math.max(0, game.screenShake - dt * 28);
      updateParticles(dt);
      updateCeremony(dt);
      return;
    }

    game.timeLeft -= dt;
    game.storyTimer = Math.max(0, game.storyTimer - dt);
    if (game.timeLeft <= 0) {
      game.timeLeft = 0;
      game.message = chapter.gameOverMessage;
      setMode('gameOver');
      return;
    }

    player.animTime += dt;
    player.throwCooldown = Math.max(0, player.throwCooldown - dt);
    player.invuln = Math.max(0, player.invuln - dt);
    game.screenShake = Math.max(0, game.screenShake - dt * 28);

    if (pressed('Space') || pressed('ArrowUp') || pressed('KeyW') || touch.jump) requestJump();
    if (pressed('KeyJ') || pressed('KeyK') || touch.throw) throwCandy();

    const moveLeft = held('ArrowLeft') || held('KeyA') || touch.left;
    const moveRight = held('ArrowRight') || held('KeyD') || touch.right;
    player.vx = 0;
    if (moveLeft) player.vx -= 250;
    if (moveRight) player.vx += 280;
    player.x = clamp(player.x + player.vx * dt, 120, 500);

    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
    if (player.y + player.h >= GROUND_Y) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.grounded = true;
    } else {
      player.grounded = false;
    }

    const nearBossGate = chapter.hasBoss && game.boss && !game.boss.defeated && game.cameraX > chapter.bossX - 720;
    let scrollSpeed = RUN_SPEED + (moveRight ? 80 : 0) - (moveLeft ? 24 : 0);
    if (nearBossGate) scrollSpeed = Math.min(scrollSpeed, 38);
    game.cameraX = Math.min(chapter.endX - 260, game.cameraX + scrollSpeed * dt);
    updateOutfitTransition(dt);

    spawnEvents();
    updateEntities(dt);
    updateBullets(dt);
    updateParticles(dt);
    handleCollisions();

    if (!chapter.hasBoss && !game.goal && game.eventIndex >= chapter.events.length) spawnGoal();
    if (chapter.hasBoss && game.boss && game.boss.defeated && !game.goal) spawnGoal();
    if (game.goal && !game.ceremony && playerWorldX() > game.goal.worldX - 260) startCeremony();
    updateCeremony(dt);
  }

  function held(code) { return !!keys[code]; }
  function pressed(code) { return !!keys[code]; }

  function requestJump() {
    if (game.mode !== 'playing') return;
    if (!player.grounded) return;
    player.vy = JUMP_V;
    player.grounded = false;
    addFloatText(player.x + 55, player.y - 8, '冲！', '#ffd36a');
  }

  function throwCandy() {
    if (game.mode !== 'playing') return;
    if (player.throwCooldown > 0) return;
    player.throwCooldown = 0.32;
    player.state = 'attack';
    player.animTime = 0;
    game.bullets.push({
      worldX: playerWorldX() + 78,
      y: player.y + 55,
      w: 46,
      h: 24,
      vx: 760,
      life: 1.15,
      maxLife: 1.15,
      scene: isChapterTwo() ? currentSceneInfo().id : null
    });
  }

  function spawnEvents() {
    const chapter = currentChapter();
    const scene = currentSceneInfo();
    while (game.eventIndex < chapter.events.length) {
      const event = chapter.events[game.eventIndex];
      if (isChapterTwo() && event.scene && event.scene !== scene.id) break;
      const triggerDistance = event.type === 'story' ? 260 : W + 260;
      if (event.at >= game.cameraX + triggerDistance) break;
      game.eventIndex += 1;
      if (event.type === 'roadblock') spawnRoadblock(event.at);
      if (event.type === 'softObstacle') spawnSoftObstacle(event.at, event);
      if (event.type === 'sceneMonster') spawnSceneMonster(event.at, event);
      if (event.type === 'redPacket') spawnRedPacket(event.at);
      if (event.type === 'balloon') spawnBalloon(event.at);
      if (event.type === 'pickup') spawnPickup(event.at, event.item, event.y);
      if (event.type === 'boss') spawnBoss(event.at);
      if (event.type === 'story') showStory(event.text);
    }
  }

  function spawnRoadblock(worldX) {
    game.entities.push({ type: 'roadblock', worldX, y: GROUND_Y - 64, w: 46, h: 64, hit: false });
  }

  function spawnSoftObstacle(worldX, event = {}) {
    const w = event.w || 38;
    const h = event.h || 78;
    game.entities.push({
      type: 'softObstacle',
      label: event.label || '人群',
      worldX,
      y: event.y ?? GROUND_Y - h,
      baseY: event.y ?? GROUND_Y - h,
      w,
      h,
      motion: event.motion,
      animTime: 0,
      hit: false
    });
  }

  function spawnSceneMonster(worldX, event = {}) {
    const scene = event.scene || currentSceneInfo().id;
    const labels = chapter2SceneMonsterLabels[scene] || ['场景小怪'];
    const variant = event.variant || 0;
    const w = event.w || 72;
    const h = event.h || 82;
    game.entities.push({
      type: 'sceneMonster',
      scene,
      variant,
      label: event.label || labels[variant % labels.length],
      worldX,
      y: event.y ?? GROUND_Y - h,
      baseY: event.y ?? GROUND_Y - h,
      w,
      h,
      hp: 1,
      vx: -16,
      animTime: 0,
      hitTimer: 0
    });
  }

  function spawnRedPacket(worldX, y = GROUND_Y - 82) {
    game.entities.push({ type: 'redPacket', worldX, y, w: 74, h: 82, hp: 1, vx: -24, animTime: 0, hitTimer: 0 });
  }

  function spawnBalloon(worldX) {
    game.entities.push({ type: 'balloon', worldX, baseY: GROUND_Y - 238, y: GROUND_Y - 238, w: 76, h: 96, hp: 1, vx: -18, animTime: 0 });
  }

  function spawnPickup(worldX, item, y) {
    const defaultY = item === 'heart' || item === 'ring' ? GROUND_Y - 170 : GROUND_Y - 122;
    const size = chapter2CollectibleItems.includes(item) ? 92 : (chapter2FoodCollectibleItems.includes(item) ? 88 : 52);
    game.entities.push({ type: 'pickup', item, worldX, y: y ?? defaultY, w: size, h: size, animTime: 0 });
  }

  function spawnBoss(worldX) {
    if (game.boss) return;
    game.boss = { type: 'boss', worldX, y: GROUND_Y - 176, w: 250, h: 174, hp: 8, maxHp: 8, animTime: 0, hitTimer: 0, spawnTimer: 1.6, defeated: false, dying: 0 };
  }

  function spawnGoal() {
    const chapter = currentChapter();
    game.goal = { worldX: chapter.endX, y: GROUND_Y - 250, w: 260, h: 250 };
  }

  function startCeremony() {
    const chapter = currentChapter();
    const cameraTarget = chapter.endX - 690;
    game.cameraX = cameraTarget;
    game.entities = [];
    game.bullets = [];
    game.ceremony = {
      time: 0,
      cameraTarget,
      kind: chapter.goalKind,
      groomStartX: player.x,
      groomTargetX: chapter.goalKind === 'farewell' ? 500 : (chapter.goalKind === 'love' ? 510 : 560),
      brideX: chapter.goalKind === 'farewell' ? 675 : (chapter.goalKind === 'love' ? 660 : 650),
      finished: false
    };
    player.vx = 0;
    player.vy = 0;
    player.y = GROUND_Y - player.h;
    player.grounded = true;
    player.invuln = 0;
    addFloatText(462, 344, chapter.goalKind === 'farewell' ? '回到校园！' : (chapter.goalKind === 'love' ? '等到答案！' : '抵达花门！'), '#ffd36a');
  }

  function updateCeremony(dt) {
    if (!game.ceremony) return;
    const c = game.ceremony;
    c.time += dt;
    game.cameraX += (c.cameraTarget - game.cameraX) * Math.min(1, dt * 6);
    player.y = GROUND_Y - player.h;
    player.grounded = true;
    player.vy = 0;

    if (c.kind === 'wedding') {
      player.x = c.groomTargetX;
      if (!c.finished && c.time > WEDDING_CEREMONY_FRAME_DURATION * 4) {
        c.finished = true;
        game.score += Math.ceil(game.timeLeft) * 10;
        burstConfetti(640, 330, 150);
        addFloatText(520, 318, '婚礼开始！', '#ffd36a');
      }
      if (Math.random() < dt * 24) sparkle(640 + (Math.random() - .5) * 520, 240 + Math.random() * 220, '#ffd36a');
      if (c.time > WEDDING_CEREMONY_DURATION && !c.videoStarted) {
        c.videoStarted = true;
        playSuccessVideo();
      }
      return;
    }

    if (c.time < 2.2) {
      const t = Math.min(1, c.time / 2.2);
      player.x = c.groomStartX + (c.groomTargetX - c.groomStartX) * easeOutCubic(t);
      if (Math.random() < dt * 18) sparkle(player.x + 88, player.y + 54, '#ffd36a');
    } else {
      player.x = c.groomTargetX;
      if (!c.finished) {
        c.finished = true;
        game.score += Math.ceil(game.timeLeft) * 10;
        burstConfetti(640, 330, 90);
        addFloatText(520, 318, c.kind === 'farewell' ? '相识完成！' : '确定恋爱！', '#ffd36a');
      }
      const finishTime = c.kind === 'farewell' ? 5.8 : 9.5;
      if (c.time > finishTime) setMode('win');
    }
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function updateEntities(dt) {
    for (const entity of game.entities) {
      entity.animTime = (entity.animTime || 0) + dt;
      if (entity.vx) entity.worldX += entity.vx * dt;
      if (entity.type === 'balloon') entity.y = entity.baseY + Math.sin(entity.animTime * 3.3) * 18;
      if (entity.type === 'sceneMonster') entity.y = entity.baseY + Math.sin(entity.animTime * 4.2) * 5;
      if (entity.type === 'softObstacle') {
        const amp = entity.motion === 'bounce' ? 24 : 3;
        const freq = entity.motion === 'bounce' ? 8 : 3;
        entity.y = entity.baseY - Math.abs(Math.sin(entity.animTime * freq)) * amp;
      }
      if (entity.type === 'pickup') entity.y += Math.sin(entity.animTime * 5) * dt * 14;
      entity.hitTimer = Math.max(0, (entity.hitTimer || 0) - dt);
    }
    game.entities = game.entities.filter(entity => !entity.dead && entity.worldX > game.cameraX - 360);

    if (game.boss && !game.boss.defeated) {
      const boss = game.boss;
      boss.animTime += dt;
      boss.hitTimer = Math.max(0, boss.hitTimer - dt);
      boss.spawnTimer -= dt;
      if (boss.spawnTimer <= 0) {
        boss.spawnTimer = 2.8;
        spawnRedPacket(boss.worldX + 230, GROUND_Y - 82);
      }
    }
    if (game.boss && game.boss.defeated) {
      game.boss.dying += dt;
    }
  }

  function updateBullets(dt) {
    for (const bullet of game.bullets) {
      bullet.worldX += bullet.vx * dt;
      bullet.life -= dt;
    }
    game.bullets = game.bullets.filter(bullet => bullet.life > 0 && bullet.worldX - game.cameraX < W + 160);
  }

  function updateParticles(dt) {
    for (const p of game.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += (p.gravity || 0) * dt;
      p.life -= dt;
      p.age += dt;
    }
    game.particles = game.particles.filter(p => p.life > 0);
  }

  function handleCollisions() {
    const ph = playerHitbox();

    for (const bullet of game.bullets) {
      const bh = { x: bullet.worldX - game.cameraX, y: bullet.y, w: bullet.w, h: bullet.h };
      for (const entity of game.entities) {
        if (!['redPacket', 'balloon', 'sceneMonster'].includes(entity.type) || entity.dead) continue;
        if (hit(bh, entityHitbox(entity))) {
          bullet.life = 0;
          entity.hp -= 1;
          entity.hitTimer = .16;
          sparkle(bh.x + 20, bh.y + 10, '#ffd36a');
          if (entity.hp <= 0) {
            entity.dead = true;
            const points = entity.type === 'balloon' ? 150 : (entity.type === 'sceneMonster' ? 180 : 100);
            game.score += points;
            game.redPackets += entity.type === 'redPacket' ? 1 : 0;
            addFloatText(entity.worldX - game.cameraX, entity.y, `+${points}`, '#ffd36a');
            burstConfetti(entity.worldX - game.cameraX + entity.w / 2, entity.y + 30, 16);
          }
        }
      }

      if (game.boss && !game.boss.defeated && hit(bh, bossHitbox())) {
        bullet.life = 0;
        game.boss.hp -= 1;
        game.boss.hitTimer = .18;
        game.score += 50;
        sparkle(bh.x + 22, bh.y, '#ff75a8');
        addFloatText(game.boss.worldX - game.cameraX + 110, game.boss.y - 20, '-1', '#ff75a8');
        if (game.boss.hp <= 0) {
          game.boss.defeated = true;
          game.score += 1000;
          addFloatText(game.boss.worldX - game.cameraX + 80, game.boss.y - 35, '婚车通行！', '#ffd36a');
          burstConfetti(game.boss.worldX - game.cameraX + 110, game.boss.y + 80, 72);
        }
      }
    }

    for (const entity of game.entities) {
      if (entity.dead) continue;
      if (entity.type === 'pickup' && hit(ph, entityHitbox(entity))) {
        collectPickup(entity);
        entity.dead = true;
      } else if (['redPacket', 'balloon', 'roadblock', 'softObstacle', 'sceneMonster'].includes(entity.type) && hit(ph, entityHitbox(entity))) {
        const message = entity.type === 'softObstacle'
          ? `被${entity.label}轻轻拦了一下。`
          : (entity.type === 'sceneMonster' ? `被${entity.label || '场景小怪'}拦住了。` : (entity.type === 'roadblock' ? '撞到婚礼路障了。' : '被闹关小怪拦住了。'));
        damagePlayer(message);
      }
    }

    if (game.boss && !game.boss.defeated && hit(ph, bossHitbox())) damagePlayer('被堵车怪挡住了去路。');
  }

  function damagePlayer(message) {
    if (player.invuln > 0) return;
    player.hearts -= 1;
    player.invuln = 1.15;
    player.vy = -360;
    player.grounded = false;
    game.screenShake = 9;
    sparkle(player.x + 60, player.y + 60, '#ff4d6d');
    if (player.hearts <= 0) {
      game.message = message;
      setMode('gameOver');
    }
  }

  function playerWorldX() { return game.cameraX + player.x; }

  function playerHitbox() {
    return { x: player.x + 30, y: player.y + 24, w: player.w - 52, h: player.h - 32 };
  }

  function entityHitbox(entity) {
    const x = entity.worldX - game.cameraX;
    if (entity.type === 'roadblock') return { x: x + 14, y: entity.y + 18, w: Math.max(12, entity.w - 28), h: Math.max(28, entity.h - 26) };
    if (entity.type === 'softObstacle') {
      if (entity.label === '山治') return { x: x + 2, y: entity.y + 8, w: 68, h: 96 };
      return { x: x + 22, y: entity.y + 24, w: Math.max(10, entity.w - 44), h: Math.max(30, entity.h - 32) };
    }
    if (entity.type === 'pickup') return { x: x + 6, y: entity.y + 6, w: entity.w - 12, h: entity.h - 12 };
    if (entity.type === 'sceneMonster') return { x: x + 10, y: entity.y + 12, w: Math.max(34, entity.w - 20), h: Math.max(44, entity.h - 18) };
    return { x: x + entity.w * .18, y: entity.y + entity.h * .14, w: entity.w * .64, h: entity.h * .72 };
  }

  function bossHitbox() {
    const boss = game.boss;
    return { x: boss.worldX - game.cameraX + 28, y: boss.y + 36, w: boss.w - 56, h: boss.h - 44 };
  }

  function hit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function sparkle(x, y, color) {
    for (let i = 0; i < 10; i++) {
      game.particles.push({ x, y, vx: (Math.random() - .5) * 220, vy: (Math.random() - .8) * 180, life: .45 + Math.random() * .25, age: 0, size: 4 + Math.random() * 4, color, gravity: 280 });
    }
  }

  function burstConfetti(x, y, count) {
    const colors = ['#ff4d6d', '#ffb3c8', '#ffd36a', '#8cf4ff', '#ffffff'];
    for (let i = 0; i < count; i++) {
      game.particles.push({
        x, y,
        vx: (Math.random() - .5) * 420,
        vy: -260 - Math.random() * 260,
        life: .9 + Math.random() * .8,
        age: 0,
        size: 3 + Math.random() * 6,
        color: colors[i % colors.length],
        gravity: 620
      });
    }
  }

  function addFloatText(x, y, text, color) {
    game.particles.push({ x, y, vx: 0, vy: -58, life: .85, age: 0, text, color, gravity: 0 });
  }

  function render() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = false;

    if (game.screenShake > 0 && game.mode === 'playing') {
      ctx.translate((Math.random() - .5) * game.screenShake, (Math.random() - .5) * game.screenShake);
    }

    if (game.mode === 'menu' || game.mode === 'loading' || game.mode === 'chapterSelect') {
      drawCover();
      drawVignette(.28);
    } else {
      drawGameWorld();
    }

    ctx.restore();

    if ((game.mode === 'playing' || game.mode === 'paused') && !(game.ceremony && game.ceremony.kind === 'wedding')) drawHud();
  }

  function drawCover() {
    const cover = img('cover');
    if (!cover) {
      drawGradientSky();
      return;
    }
    drawImageCover(cover, 0, 0, W, H);
    ctx.fillStyle = 'rgba(24, 4, 16, .18)';
    ctx.fillRect(0, 0, W, H);
  }

  function drawGameWorld() {
    if (game.ceremony && game.ceremony.kind === 'wedding') {
      drawWeddingCeremonyFrames(game.ceremony);
      drawParticles();
      return;
    }
    drawScrollingBackground();
    drawGoal();
    if (!(game.ceremony && game.ceremony.kind === 'love')) {
      drawChapterBrideMoments();
      drawEntities();
      drawBoss();
      drawBullets();
      drawPlayer();
    }
    drawParticles();
    drawSceneLabel();
    drawSceneTransition();
    if (DEBUG_HITBOXES) drawDebugHitboxes();
  }

  function drawGradientSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1b83d8');
    g.addColorStop(.55, '#75dcff');
    g.addColorStop(1, '#f7d6b7');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawScrollingBackground() {
    if (isChapterOne()) {
      drawCampusBackground();
      return;
    }
    if (isChapterTwo()) {
      drawTravelBackground();
      return;
    }
    if (currentChapter().id === 'wedding') {
      drawWeddingBackground();
      return;
    }

    const bg = img('streetBg');
    if (!bg) {
      drawGradientSky();
      ctx.fillStyle = '#b45a4b';
      ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
      return;
    }
    const offset = -((game.cameraX * .72) % W);
    ctx.drawImage(bg, offset, 0, W, H);
    ctx.drawImage(bg, offset + W, 0, W, H);
    if (offset > 0) ctx.drawImage(bg, offset - W, 0, W, H);
    ctx.fillStyle = 'rgba(255, 244, 252, .05)';
    ctx.fillRect(0, 0, W, H);
  }

  function drawCampusBackground() {
    const scene = currentSceneInfo();
    if (!drawChapterOneImageScene(scene)) {
      if (scene.id === 'cafeteria') drawCafeteriaScene(scene.localProgress);
      else if (scene.id === 'qingdao') drawQingdaoScene(scene.localProgress);
      else drawGraduationScene(scene.localProgress);
    }

    ctx.fillStyle = 'rgba(255,255,255,.04)';
    ctx.fillRect(0, 0, W, H);
  }

  function drawChapterOneImageScene(scene) {
    const keyMap = {
      cafeteria: 'bgCh1Cafeteria',
      qingdao: 'bgCh1Qingdao',
      graduation: 'bgCh1Graduation'
    };
    const image = img(keyMap[scene.id]);
    if (!image) return false;
    drawImageCover(image, 0, 0, W, H);
    const offset = -((game.cameraX * .14) % 104);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    for (let x = offset; x < W + 104; x += 104) {
      ctx.fillRect(x, GROUND_Y - 2, 52, 3);
    }
    return true;
  }

  function drawTravelBackground() {
    const scene = currentSceneInfo();
    if (!drawTravelImageScene(scene)) {
      if (scene.id === 'disney') drawDisneyScene(scene.localProgress);
      else if (scene.id === 'universal') drawUniversalScene(scene.localProgress);
      else if (scene.id === 'hongkong') drawHongKongScene(scene.localProgress);
      else if (scene.id === 'macau') drawMacauScene(scene.localProgress);
      else drawGrandCanalScene(scene.localProgress);
    }

    ctx.fillStyle = 'rgba(255,255,255,.04)';
    ctx.fillRect(0, 0, W, H);
  }

  function currentSceneInfo() {
    const progress = clamp(game.cameraX / currentChapter().endX, 0, 1);
    const scenes = isChapterTwo() ? [
      { id: 'disney', title: '上海迪士尼', desc: '烟火和城堡之间，约会像童话开场。', from: 0, to: .215 },
      { id: 'universal', title: '环球影城', desc: '魔法街巷里，笑声离得很近。', from: .215, to: .433 },
      { id: 'hongkong', title: '香港维多利亚港', desc: '夜色和海风，陪她挑中发财款哈奇猫。', from: .433, to: .617 },
      { id: 'macau', title: '澳门大三巴', desc: '石阶和蛋挞小八，让回忆变得很甜。', from: .617, to: .805 },
      { id: 'grandcanal', title: '北京通州大运河', desc: '水光和桥影之间，那句话终于快要说出口。', from: .805, to: 1 }
    ] : (currentChapter().id === 'wedding' ? [
      { id: 'weddingStreet', title: '迎亲街区', desc: '喜字和灯笼亮起，新郎出发去接她。', from: 0, to: .41 },
      { id: 'weddingGarden', title: '婚礼花园', desc: '花瓣落在路边，掌声越来越近。', from: .41, to: .72 },
      { id: 'weddingPalace', title: '美泉宫花门', desc: '最后一段红毯，通向正在等待的新娘。', from: .72, to: 1 }
    ] : [
      { id: 'cafeteria', title: '大学食堂', desc: '军训后的饭点很吵，第一眼却很安静。', from: 0, to: .42 },
      { id: 'qingdao', title: '青岛海边', desc: '海风很轻，离别被轻轻说起。', from: .42, to: .75 },
      { id: 'graduation', title: '毕业季校园', desc: '一人启程，一人把青春继续写完。', from: .75, to: 1 }
    ]);
    const index = Math.max(0, scenes.findIndex(item => progress >= item.from && progress < item.to));
    const scene = scenes[index] || scenes[scenes.length - 1];
    return {
      ...scene,
      index,
      prev: scenes[index - 1] || null,
      next: scenes[index + 1] || null,

    if ((!isChapterOne() && !isChapterTwo() && currentChapter().id !== 'wedding') || game.ceremony) return;

    const edgeOut = scene.next ? clamp((scene.localProgress - .9) / .1, 0, 1) : 0;

      ctx.lineWidth = 3;
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
        const len = 22 + Math.sin(t * 6 + i) * 7;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
        ctx.stroke();
      }
    }
  }

    const g = ctx.createLinearGradient(0, 0, 0, H);

  function drawWeddingCeremonyFrames(ceremony) {
    const rawIndex = Math.floor(ceremony.time / WEDDING_CEREMONY_FRAME_DURATION);
    const frameIndex = clamp(rawIndex, 0, WEDDING_CEREMONY_KEYS.length - 1);
    const image = img(WEDDING_CEREMONY_KEYS[frameIndex]);
    if (image) drawImageCover(image, 0, 0, W, H);
    else {
      drawCover();
      ctx.fillStyle = 'rgba(24, 4, 16, .62)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffd36a';
      ctx.font = '900 28px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText('婚礼仪式正在加载...', 500, 350);
    }

    const fadeIn = clamp(ceremony.time / .45, 0, 1);
    const endFade = clamp((ceremony.time - WEDDING_CEREMONY_DURATION + .55) / .55, 0, 1);
    ctx.fillStyle = `rgba(24, 4, 16, ${.12 + endFade * .38})`;
    ctx.fillRect(0, 0, W, H);
    if (fadeIn < 1) {
      ctx.fillStyle = `rgba(24, 4, 16, ${1 - fadeIn})`;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.fillStyle = 'rgba(38, 7, 24, .56)';
    roundRect(246, 34, 788, 78, 24, true);
    ctx.strokeStyle = 'rgba(255, 211, 106, .46)';

    roundRect(246, 34, 788, 78, 24, false);

    ctx.font = '900 24px -apple-system, BlinkMacSystemFont, sans-serif';

    ctx.fillStyle = '#fff7f9';
    ctx.font = '800 22px -apple-system, BlinkMacSystemFont, sans-serif';

    ctx.fillStyle = 'rgba(36, 8, 28, .58)';
    roundRect(420, 626, 440, 38, 19, true);
    ctx.fillStyle = 'rgba(255,255,255,.36)';
    roundRect(444, 641, 392, 8, 4, true);
    ctx.fillStyle = '#ffd36a';
    roundRect(444, 641, 392 * clamp(ceremony.time / WEDDING_CEREMONY_DURATION, 0, 1), 8, 4, true);
    drawVignette(.22);
  }

  function drawGoal() {
    if (!game.goal) return;
    const x = game.goal.worldX - game.cameraX;
    const ceremony = game.ceremony;
    const archX = ceremony ? 455 : x - 90;
    const brideX = ceremony ? ceremony.brideX : x + 34;
    const carX = ceremony ? 780 : x + 155;

    ctx.save();
    if (ceremony) {
      const glow = ctx.createRadialGradient(640, 360, 40, 640, 360, 300);
      glow.addColorStop(0, 'rgba(255, 225, 154, .42)');
      glow.addColorStop(1, 'rgba(255, 225, 154, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(260, 110, 760, 480);
      ctx.fillStyle = currentChapter().goalKind === 'farewell' ? 'rgba(255, 211, 106, .24)' : 'rgba(255, 117, 168, .22)';
      roundRect(410, GROUND_Y - 35, 470, 18, 9, true);
    }

    if (currentChapter().goalKind === 'farewell') {
      drawFarewellGoal(x, ceremony);
      ctx.restore();
      return;
    }
    if (currentChapter().goalKind === 'love') {
      drawLoveGoal(x, ceremony);
      ctx.restore();
      return;
    }

    drawSingle('weddingArch', assetRects.arch, archX, GROUND_Y - 325, 330, 330);
    drawSingle('weddingCar', assetRects.car, carX, GROUND_Y - 118, 250, 128);
    const brideSet = ceremony && ceremony.time > 2.2 ? frames.bride.happy : frames.bride.wave;
    const brideFrame = choose(brideSet, performance.now() / 1000, 4);
    drawFrame('bride', brideFrame, brideX, GROUND_Y - 198, 100, 156);

    if (ceremony) {
      ctx.fillStyle = 'rgba(38, 7, 24, .46)';
      roundRect(405, 118, 470, 56, 20, true);
      ctx.strokeStyle = 'rgba(255, 211, 106, .42)';
      roundRect(405, 118, 470, 56, 20, false);
      ctx.fillStyle = '#fff7f9';
      ctx.font = '900 24px -apple-system, BlinkMacSystemFont, sans-serif';
      const text = ceremony.time < 2.2 ? '新郎冲进花门，奔向新娘！' : '恭喜！婚礼正式开始！';
      ctx.fillText(text, ceremony.time < 2.2 ? 488 : 505, 154);
    }
    ctx.restore();
  }

  function drawHeart(cx, cy, scale, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.fillStyle = color;
    ctx.fillRect(-10, -4, 8, 8);
    ctx.fillRect(2, -4, 8, 8);
    ctx.fillRect(-14, 2, 28, 10);
    ctx.fillRect(-10, 12, 20, 8);
    ctx.fillRect(-5, 20, 10, 6);

  function drawLoveKeepsakeOverlay(ceremony) {
    const elapsed = ceremony.time - 6.4;
    if (elapsed < 0) return;
    const alpha = Math.min(clamp(elapsed / .55, 0, 1), 1 - clamp((elapsed - 2.5) / .6, 0, 1));
    if (alpha <= 0) return;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(20, 7, 18, .5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255, 245, 232, .94)';
    roundRect(396, 126, 488, 430, 34, true);
    ctx.strokeStyle = 'rgba(255, 211, 106, .72)';
    ctx.lineWidth = 4;
    roundRect(396, 126, 488, 430, 34, false);
    ctx.shadowColor = 'rgba(255, 211, 106, .7)';
    ctx.shadowBlur = 22;
    drawOriginalGoldPendant(640, 282, 172);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#8b4d36';
    ctx.font = '900 32px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText('定情之物', 568, 420);
    ctx.fillStyle = 'rgba(139, 77, 54, .78)';
    ctx.font = '800 20px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText('这枚金色挂坠，见证他们正式在一起。', 466, 462);
    ctx.restore();
  }

  function drawLoveEmbraceAnimation(ceremony) {
    const elapsed = Math.max(0, ceremony.time - 2.2);
    const index = clamp(Math.floor(elapsed / .55), 0, loveEmbraceFrames.length - 1);
    const frame = loveEmbraceFrames[index];
    const scale = 1.18;
    const w = frame.sw * scale;
    const h = frame.sh * scale;
    const x = 640 - w / 2;
    const y = GROUND_Y - h - 8;
    ctx.save();
    ctx.fillStyle = 'rgba(255, 245, 252, .22)';
    roundRect(x - 24, y + h - 12, w + 48, 14, 7, true);
    drawFrame('loveEmbrace', frame, x, y, w, h);
    if (elapsed > 1.6) {
      const t = performance.now() / 1000;
      for (let i = 0; i < 4; i++) {
        const hx = 560 + i * 36 + Math.sin(t * 2 + i) * 8;
        const hy = 218 + Math.cos(t * 2.4 + i) * 8;
        drawHeart(hx, hy, .34 + i * .03, i % 2 ? '#ffd36a' : '#ff75a8');
      }
    }
    ctx.restore();
  }

  function drawLoveGoal(x, ceremony) {
    const centerX = ceremony ? 640 : x + 80;
    ctx.save();
    ctx.fillStyle = 'rgba(255, 245, 252, .18)';
    roundRect(centerX - 190, GROUND_Y - 122, 380, 28, 14, true);
    ctx.globalAlpha = ceremony && ceremony.time >= 2.2 ? .48 : 1;
    drawCatSouvenir(centerX + 160, GROUND_Y - 154, .78, '#ffd36a');
    drawOriginalGoldPendant(centerX - 164, GROUND_Y - 152, 74);
    ctx.restore();

    if (ceremony && ceremony.time >= 2.2) {
      drawLoveEmbraceAnimation(ceremony);
    } else {
      const frame = choose(chapter2BrideFrames.grandcanal, performance.now() / 1000, 1.35);
      const brideDrawX = ceremony ? ceremony.brideX : centerX + 94;
      const scale = .76;
      drawFrame('brideCh2GrandCanal', frame, brideDrawX, GROUND_Y - 178, frame.sw * scale, frame.sh * scale);
    }

    if (ceremony) {
      drawLoveKeepsakeOverlay(ceremony);
      const text = ceremony.time < 2.2 ? '通州大运河边，他终于把喜欢说出口。' : '新娘：好呀，那我们就在一起吧。';
      const subText = ceremony.time >= 2.2 ? '他把金色挂坠轻轻戴到她身上，然后他们紧紧拥抱。' : '';
      ctx.fillStyle = 'rgba(38, 7, 24, .56)';
      roundRect(270, 620, 740, subText ? 72 : 48, 22, true);
      ctx.strokeStyle = 'rgba(255, 211, 106, .42)';
      roundRect(270, 620, 740, subText ? 72 : 48, 22, false);
      ctx.fillStyle = '#fff7f9';
      ctx.font = '900 23px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText(text, ceremony.time < 2.2 ? 394 : 442, 650);
      if (subText) {
        ctx.fillStyle = '#ffd36a';
        ctx.font = '800 18px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(subText, 390, 678);

  function drawFarewellGoal(x, ceremony) {
    const centerX = ceremony ? 640 : x + 80;

    roundRect(centerX - 210, GROUND_Y - 82, 420, 24, 12, true);

    const photoFrame = chapter1CollectibleFrames.graduationPhoto;

    const brideFrame = choose(chapter1NpcFrames, performance.now() / 1000, 4);
    const visibleBrideFrame = trimmedFrame('brideCh1Graduation', brideFrame);
    const brideH = 180;
    const brideW = brideH * (visibleBrideFrame.sw / visibleBrideFrame.sh);
    drawFrame('brideCh1Graduation', visibleBrideFrame, ceremony ? ceremony.brideX : centerX + 98, GROUND_Y - brideH, brideW, brideH);

      roundRect(330, 104, 620, 92, 24, false);
      ctx.fillStyle = '#fff7f9';

      const text = ceremony.time < 2.2 ? '毕业季的风吹过校园，分别悄悄站在路口。' : '新郎：我要毕业了，你还要继续好好读书。';
      ctx.fillText(text, ceremony.time < 2.2 ? 415 : 386, 148);
      if (ceremony.time >= 2.2) {
        ctx.fillStyle = '#ffd36a';
        ctx.font = '800 20px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('新娘把大二的日子继续写下去，新郎带着海风和牵挂启程。', 356, 178);
      }
    }
  }

  function drawEntities() {
    for (const entity of game.entities) {
      if (entity.type === 'pickup') continue;
      const x = entity.worldX - game.cameraX;
      if (x < -260 || x > W + 260) continue;
      if (game.ceremony) continue;
      if (entity.type === 'roadblock') drawSingle('roadblock', assetRects.roadblock, x - 8, entity.y - 16, entity.w + 18, entity.h + 20);
      if (entity.type === 'softObstacle') drawSoftObstacle(entity, x);
      if (entity.type === 'sceneMonster') drawSceneMonster(entity, x);
      if (entity.type === 'redPacket') {
        const set = entity.hitTimer > 0 ? frames.redPacket.hit : frames.redPacket.walk;
        drawFrame('redPacket', choose(set, entity.animTime, 7), x - 28, entity.y - 26, 128, 128);
      }
      if (entity.type === 'balloon') drawFrame('balloon', choose(frames.balloon.float, entity.animTime, 5), x - 28, entity.y - 30, 128, 150);
    }
    for (const entity of game.entities) {
      if (entity.type !== 'pickup') continue;
      const x = entity.worldX - game.cameraX;
      if (x < -260 || x > W + 260) continue;
      drawPickup(entity, x);
    }
  }

  function drawSceneMonster(entity, x) {
    const frames = chapter2SceneMonsterFrames[entity.scene] || chapter2SceneMonsterFrames.disney;
    const pair = entity.variant % 2;
    const frameSet = entity.scene === 'disney' && entity.variant % 2 === 1
      ? [frames[2]].filter(Boolean)
      : [frames[pair * 2], frames[pair * 2 + 1]].filter(Boolean);
    const frame = choose(frameSet.length ? frameSet : frames, entity.animTime, 3.4);
    const bob = Math.sin(entity.animTime * 5) * 1.5;
    const isDisneyQueen = entity.scene === 'disney' && entity.variant % 2 === 1;
    const drawH = isDisneyQueen ? 245 : (entity.scene === 'hongkong' ? 201 : 224);
    const drawW = drawH * (frame.sw / frame.sh);
    const dx = x + entity.w / 2 - drawW / 2;
    const footY = GROUND_Y + bob;
    const dy = footY - drawH;
    ctx.save();
    if (entity.hitTimer > 0) ctx.globalAlpha = .62;
    ctx.fillStyle = 'rgba(43, 22, 28, .2)';
    roundRect(dx + 14, GROUND_Y - 15, drawW - 28, 12, 6, true);
    drawFrame('chapter2SceneMonsters', frame, dx, dy, drawW, drawH);
    ctx.restore();
  }

  function drawSanjiObstacle(entity, x) {
    ctx.save();
    const image = img('sanjiObstacle');
    if (image) {
      const bob = Math.sin(entity.animTime * 3) * 1.5;
      const drawH = 178;
      const drawW = 175;
      const cx = x + entity.w / 2;
      const cy = GROUND_Y - drawH / 2 + bob;
      const angle = Math.sin(entity.animTime * 4) * Math.PI / 12;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.drawImage(image, -drawW / 2, -drawH / 2, drawW, drawH);
      ctx.restore();
    } else {
      drawSanji(x + entity.w / 2, entity.y + entity.h / 2, entity.animTime);
    }
    ctx.fillStyle = 'rgba(36, 8, 28, .66)';
    roundRect(x - 8, entity.y - 24, entity.label.length * 16 + 22, 26, 13, true);
    ctx.fillStyle = '#fff7f9';
    ctx.font = '700 14px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText(entity.label, x + 3, entity.y - 6);
    ctx.restore();
  }

  function drawSoftObstacle(entity, x) {
    if (entity.label === '山治') {
      drawSanjiObstacle(entity, x);
      return;
    }
    if (isChapterOne()) {
      const frames = chapter1ObstacleFrames[entity.label];
      if (frames) {
        const frame = choose(frames, entity.animTime, 1.4);
        const visibleFrame = trimmedFrame('chapter1Obstacles', frame);
        const bob = Math.sin(entity.animTime * 4) * 1.2;
        const drawH = 172;
        const drawW = drawH * (visibleFrame.sw / visibleFrame.sh);
        const dx = x + entity.w / 2 - drawW / 2;
        const dy = GROUND_Y - drawH + bob;
        ctx.save();
        ctx.fillStyle = 'rgba(43, 22, 28, .18)';
        roundRect(dx + 12, GROUND_Y - 16, drawW - 24, 12, 6, true);
        drawFrame('chapter1Obstacles', visibleFrame, dx, dy, drawW, drawH);
        ctx.restore();
        return;
      }
    }
    if (isChapterTwo()) {
      const sceneId = chapter2ObstacleSceneByLabel[entity.label];
      const frames = chapter2TouristObstacleFrames[sceneId];
      if (frames) {
        const frame = choose(frames, entity.animTime, 1.4);
        const bob = Math.sin(entity.animTime * 4) * 1.5;
        const drawH = 199;
        const drawW = drawH * (frame.sw / frame.sh);
        const dx = x + entity.w / 2 - drawW / 2;
        const dy = GROUND_Y - drawH + bob;
        ctx.save();
        ctx.fillStyle = 'rgba(43, 22, 28, .18)';
        roundRect(dx + 12, GROUND_Y - 16, drawW - 24, 12, 6, true);
        drawFrame('chapter2TouristObstacles', frame, dx, dy, drawW, drawH);
        ctx.restore();
        return;
      }
    }
    const colors = {
      '赶课人群': '#5b8def',
      '排队队伍': '#f49a54',
      '海边行李箱': '#4bb6c7',
      '毕业人群': '#8562d5',
      '排队人潮': '#ff75a8',
      '魔法人群': '#8f6bd8',
      '港湾人潮': '#63a5ff',
      '石阶游客': '#d68a5f',
      '山治': '#f1c75b'
    };
    const color = colors[entity.label] || '#8aa2d6';
    ctx.save();
    ctx.fillStyle = 'rgba(43, 22, 28, .18)';
    roundRect(x + 8, GROUND_Y - 16, entity.w - 12, 12, 6, true);
    for (let i = 0; i < 2; i++) {
      const px = x + 18 + i * 24;
      const bob = Math.sin(entity.animTime * 5 + i) * 3;
      ctx.fillStyle = color;
      roundRect(px, entity.y + 32 + bob, 20, 45, 10, true);
      ctx.fillStyle = '#ffd7b5';
      ctx.beginPath();
      ctx.arc(px + 10, entity.y + 22 + bob, 10, 0, Math.PI * 2);
      ctx.fill();
    }
    if (entity.label === '海边行李箱') {
      ctx.fillStyle = '#ffcf67';
      roundRect(x + 28, entity.y + 50, 42, 40, 8, true);
      ctx.strokeStyle = '#7a4e2f';
      ctx.strokeRect(x + 40, entity.y + 38, 18, 15);
    }
    ctx.fillStyle = 'rgba(36, 8, 28, .66)';
    roundRect(x - 8, entity.y - 24, entity.label.length * 16 + 22, 26, 13, true);
    ctx.fillStyle = '#fff7f9';
    ctx.font = '700 14px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText(entity.label, x + 3, entity.y - 6);
    ctx.restore();
  }

  function drawPickup(entity, x) {
    if (chapter1CollectibleItems.includes(entity.item)) {
      drawChapterOneCollectible(entity.item, x + entity.w / 2, entity.y + entity.h / 2, entity.animTime);
      return;
    }
    if (chapter2CollectibleItems.includes(entity.item)) {
      drawTravelCollectible(entity.item, x + entity.w / 2, entity.y + entity.h / 2, entity.animTime);
      return;
    }
    if (chapter2FoodCollectibleItems.includes(entity.item)) {
      drawFoodCollectible(entity.item, x + entity.w / 2, entity.y + entity.h / 2, entity.animTime);
      return;
    }
    const rectName = entity.item === 'heart' || entity.item === 'ring' ? 'heart' : entity.item;
    const rect = assetRects.items[rectName] || assetRects.items.redPacket;
    drawSingle('items', rect, x, entity.y, entity.w, entity.h);
  }

  function drawChapterOneCollectible(item, cx, cy, animTime) {
    const foodFrame = chapter1QingdaoFoodFrames[item];
    const imageKey = foodFrame ? 'chapter1QingdaoFood' : 'chapter1Collectibles';
    const frame = foodFrame || chapter1CollectibleFrames[item];
    if (!frame) return;
    const visibleFrame = trimmedFrame(imageKey, frame);
    const bob = Math.sin(animTime * 4) * 3;
    const maxSize = foodFrame ? 92 : 82;
    const scale = Math.min(maxSize / visibleFrame.sw, maxSize / visibleFrame.sh);
    const w = visibleFrame.sw * scale;
    const h = visibleFrame.sh * scale;
    ctx.save();
    ctx.shadowColor = 'rgba(255, 211, 106, .55)';
    ctx.shadowBlur = 12;
    drawFrame(imageKey, visibleFrame, cx - w / 2, cy + bob - h / 2, w, h);
    ctx.restore();
  }

  function drawFoodCollectible(item, cx, cy, animTime) {
    const frame = chapter2FoodCollectibleFrames[item];
    if (!frame) return;
    const bob = Math.sin(animTime * 4) * 3;
    const maxSize = 88;
    const scale = Math.min(maxSize / frame.sw, maxSize / frame.sh);
    const w = frame.sw * scale;
    const h = frame.sh * scale;
    ctx.save();
    ctx.shadowColor = 'rgba(255, 211, 106, .5)';
    ctx.shadowBlur = 12;
    drawFrame('chapter2FoodCollectibles', frame, cx - w / 2, cy + bob - h / 2, w, h);
    ctx.restore();
  }

  function drawTravelCollectible(item, cx, cy, animTime) {
    const bob = Math.sin(animTime * 4) * 3;
    ctx.save();
    ctx.shadowColor = 'rgba(255, 211, 106, .65)';
    ctx.shadowBlur = 14;
    if (item === 'goldPendant') {
      drawOriginalGoldPendant(cx, cy + bob, 118);
      ctx.restore();
      return;
    }
    const frame = chapter2CollectibleFrames[item];
    const maxSize = 82;
    const scale = Math.min(maxSize / frame.sw, maxSize / frame.sh);
    const w = frame.sw * scale;
    const h = frame.sh * scale;
    drawFrame('chapter2Collectibles', frame, cx - w / 2, cy + bob - h / 2, w, h);
    ctx.restore();
  }

  function drawOriginalGoldPendant(cx, cy, maxSize) {
    const image = img('goldPendantOriginal');
    if (!image) {
      drawGoldPendant(cx, cy, .72, performance.now() / 1000);
      return;
    }
    const scale = Math.min(maxSize / image.width, maxSize / image.height);
    const w = image.width * scale;
    const h = image.height * scale;
    ctx.drawImage(image, cx - w / 2, cy - h / 2, w, h);
  }

  function drawGoldPendant(cx, cy, scale, animTime = 0) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    const shine = .65 + Math.sin(animTime * 5) * .25;
    ctx.strokeStyle = '#f7d66a';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(0, -18, 34, Math.PI * .16, Math.PI * .84);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.58)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -18, 25, Math.PI * .2, Math.PI * .8);
    ctx.stroke();

    const g = ctx.createRadialGradient(-9, -2, 4, 0, 10, 34);
    g.addColorStop(0, `rgba(255,255,222,${shine})`);
    g.addColorStop(.38, '#ffd36a');
    g.addColorStop(1, '#c78121');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.bezierCurveTo(28, -25, 40, 12, 0, 42);
    ctx.bezierCurveTo(-40, 12, -28, -25, 0, -8);
    ctx.fill();
    ctx.strokeStyle = '#fff0a8';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,.72)';
    ctx.beginPath();
    ctx.ellipse(-10, 5, 7, 13, .55, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff7c9';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(30, -20);
    ctx.lineTo(44, -20);
    ctx.moveTo(37, -27);
    ctx.lineTo(37, -13);
    ctx.stroke();
    ctx.restore();
  }

  function drawPendantCloseup(t) {
    const fadeIn = clamp(t / .45, 0, 1);
    const fadeOut = 1 - clamp((t - 3.4) / .75, 0, 1);
    const alpha = Math.min(fadeIn, fadeOut);
    if (alpha <= 0) return;

    ctx.save();
    ctx.globalAlpha = alpha;
    drawOriginalGoldPendant(640, 328, 130);
    ctx.restore();
  }

  function drawSanji(cx, cy, animTime) {
    ctx.save();
    const lean = Math.sin(animTime * 10) * .15;
    ctx.translate(cx, cy);
    ctx.rotate(lean);
    ctx.fillStyle = 'rgba(43, 22, 28, .18)';
    roundRect(-22, 32, 44, 10, 5, true);
    ctx.fillStyle = '#f1c75b';
    ctx.beginPath();
    ctx.arc(0, -24, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#22243a';
    roundRect(-13, -10, 26, 38, 8, true);
    ctx.strokeStyle = '#22243a';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(-7, 26); ctx.lineTo(-20, 44);
    ctx.moveTo(7, 26); ctx.lineTo(24, 38 + Math.sin(animTime * 12) * 7);
    ctx.stroke();
    ctx.strokeStyle = '#ffd7b5';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-13, 0); ctx.lineTo(-28, 13);
    ctx.moveTo(13, 0); ctx.lineTo(28, -12);
    ctx.stroke();
    ctx.fillStyle = '#fff7f9';
    ctx.font = '900 12px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText('跳', -6, 8);
    ctx.restore();
  }

  function drawCatSouvenir(cx, cy, scale, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, 24 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 20 * scale, cy - 15 * scale);
    ctx.lineTo(cx - 10 * scale, cy - 34 * scale);
    ctx.lineTo(cx + 1 * scale, cy - 12 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 20 * scale, cy - 15 * scale);
    ctx.lineTo(cx + 10 * scale, cy - 34 * scale);
    ctx.lineTo(cx - 1 * scale, cy - 12 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#3b0c16';
    ctx.beginPath();
    ctx.arc(cx - 8 * scale, cy - 2 * scale, 3 * scale, 0, Math.PI * 2);
    ctx.arc(cx + 8 * scale, cy - 2 * scale, 3 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3b0c16';
    ctx.lineWidth = 2 * scale;
    ctx.beginPath();
    ctx.moveTo(cx - 6 * scale, cy + 9 * scale);
    ctx.quadraticCurveTo(cx, cy + 15 * scale, cx + 6 * scale, cy + 9 * scale);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.72)';
    ctx.font = `${Math.max(10, 12 * scale)}px -apple-system, BlinkMacSystemFont, sans-serif`;
    ctx.fillText('哈', cx - 6 * scale, cy + 29 * scale);
    ctx.restore();
  }

  function drawBoss() {
    const boss = game.boss;
    if (!boss) return;
    const x = boss.worldX - game.cameraX;
    if (x < -360 || x > W + 360) return;
    let set = frames.boss.idle;
    if (boss.defeated) set = frames.boss.die;
    else if (boss.hitTimer > 0) set = frames.boss.hurt;
    else if (boss.spawnTimer < .65) set = frames.boss.attack;
    drawFrame('trafficBoss', choose(set, boss.animTime + boss.dying, boss.defeated ? 3 : 5), x - 48, boss.y - 38, boss.w + 86, boss.h + 78);

    if (!boss.defeated) {
      const barW = 230;
      const barX = x + 10;
      const barY = boss.y - 24;
      ctx.fillStyle = 'rgba(40, 6, 20, .72)';
      roundRect(barX, barY, barW, 14, 7, true);
      ctx.fillStyle = '#ff4d6d';
      roundRect(barX + 2, barY + 2, (barW - 4) * (boss.hp / boss.maxHp), 10, 5, true);
      ctx.fillStyle = '#fff';
      ctx.font = '700 14px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText('堵车怪', barX + 80, barY - 6);
    }
  }

  function drawBullets() {
    for (const bullet of game.bullets) {
      const x = bullet.worldX - game.cameraX;
      if (isChapterTwo() && bullet.scene) {
        drawChapter2AttackEffect(bullet, x);
        continue;
      }
      drawSingle('candy', assetRects.candy, x, bullet.y, bullet.w, bullet.h);
      ctx.fillStyle = 'rgba(255, 211, 106, .28)';
      ctx.fillRect(x - 18, bullet.y + 9, 20, 4);
    }
  }

  function drawChapter2AttackEffect(bullet, x) {
    const t = (bullet.maxLife || 1.15) - bullet.life;
    const cx = x + bullet.w / 2;
    const cy = bullet.y + bullet.h / 2 + Math.sin(t * 14) * 2;
    const scene = bullet.scene;
    const key = scene === 'disney'
      ? 'attackFxDisney'
      : (scene === 'universal' ? 'attackFxUniversal' : (scene === 'grandcanal' ? 'attackFxGrandCanal' : 'attackFxHkMacau'));
    const image = img(key);
    if (!image) {
      drawSingle('candy', assetRects.candy, x, bullet.y, bullet.w, bullet.h);
      return;
    }
    const rect = chapter2AttackFxVisibleRects[key] || r(0, 0, image.width, image.height);
    const drawW = scene === 'universal' ? 54 : 48;
    const drawH = drawW * (rect.sh / rect.sw);
    ctx.save();
    ctx.globalAlpha = .96;
    ctx.drawImage(image, rect.sx, rect.sy, rect.sw, rect.sh, cx - drawW / 2, cy - drawH / 2, drawW, drawH);
    ctx.restore();
  }

  function drawPlayer() {
    let set = frames.groom.run;
    let fps = 9;
    if (!player.grounded) { set = frames.groom.jump; fps = 5; }
    else if (player.throwCooldown > .16) { set = frames.groom.attack; fps = 12; }
    else if (Math.abs(player.vx) < 10 && game.cameraX < 30) { set = frames.groom.idle; fps = 5; }
    if (player.invuln > 0 && Math.floor(player.invuln * 16) % 2 === 0) return;
    const frame = choose(set, player.animTime, fps);
    const dx = player.x - 36;
    const dy = player.y - 26;
    const transition = game.outfitTransitionDuration ? clamp(game.outfitTransitionTime / game.outfitTransitionDuration, 0, 1) : 0;
    if (transition > 0 && game.previousOutfitKey !== game.currentOutfitKey) {
      ctx.save();
      ctx.globalAlpha = easeOutCubic(transition);
      drawFrame(game.previousOutfitKey, frame, dx, dy, 168, 168);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = easeOutCubic(1 - transition);
      drawFrame(game.currentOutfitKey, frame, dx, dy, 168, 168);
      ctx.restore();
      drawOutfitTransitionSparkles(dx + 84, dy + 86, 1 - transition);
      return;
    }
    drawFrame(game.currentOutfitKey || 'groom', frame, dx, dy, 168, 168);
  }

  function drawOutfitTransitionSparkles(cx, cy, progress) {
    const scene = currentSceneInfo();
    const color = scene.id === 'universal' ? '#79f2a6' : '#ffd36a';
    ctx.save();
    ctx.globalAlpha = Math.sin(clamp(progress, 0, 1) * Math.PI);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, 56 + progress * 18, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 10; i++) {
      const angle = progress * Math.PI * 2 + i * Math.PI * .2;
      const radius = 42 + (i % 3) * 18;
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius * .72;
      ctx.beginPath();
      ctx.arc(x, y, 3 + (i % 2), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of game.particles) {
      const alpha = clamp(p.life / 1, 0, 1);
      ctx.globalAlpha = alpha;
      if (p.text) {
        ctx.font = '900 24px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(45, 6, 22, .7)';
        ctx.strokeText(p.text, p.x, p.y);
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, p.x, p.y);
      } else {
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.age * 8);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .65);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawHud() {
    const chapter = currentChapter();
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = 'rgba(36, 8, 28, .64)';
    roundRect(24, 18, 640, 58, 18, true);
    ctx.strokeStyle = 'rgba(255, 211, 106, .38)';
    ctx.lineWidth = 2;
    roundRect(24, 18, 640, 58, 18, false);

    ctx.font = '900 28px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#ff4d6d';
    ctx.fillText('❤'.repeat(player.hearts), 46, 55);
    ctx.fillStyle = 'rgba(255,255,255,.32)';
    ctx.fillText('❤'.repeat(player.maxHearts - player.hearts), 46 + player.hearts * 31, 55);

    ctx.fillStyle = '#fff7f9';
    ctx.font = '800 20px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText(`${chapter.countLabel} x${chapterCollectCount()}`, 185, 54);
    ctx.fillText(`分数 ${String(game.score).padStart(5, '0')}`, 315, 54);
    ctx.fillStyle = '#ffd36a';
    ctx.fillText(chapter.title, 480, 54);

    const timeW = 285;
    ctx.fillStyle = 'rgba(36, 8, 28, .64)';
    roundRect(W - timeW - 24, 18, timeW, 58, 18, true);
    ctx.strokeStyle = game.timeLeft < 20 ? '#ff4d6d' : 'rgba(255, 211, 106, .38)';
    roundRect(W - timeW - 24, 18, timeW, 58, 18, false);
    ctx.fillStyle = game.timeLeft < 20 ? '#ff758f' : '#ffd36a';
    ctx.font = '900 23px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText(`${chapter.timerLabel} ${Math.ceil(game.timeLeft)}s`, W - timeW - 2, 54);

    if (game.storyTimer > 0 && game.storyText) {
      const alpha = clamp(game.storyTimer / .8, 0, 1);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(36, 8, 28, .72)';
      roundRect(260, 94, 760, 64, 22, true);
      ctx.strokeStyle = 'rgba(255, 211, 106, .36)';
      roundRect(260, 94, 760, 64, 22, false);
      ctx.fillStyle = '#fff7f9';
      ctx.font = '900 22px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText(game.storyText, 295, 134);
      ctx.globalAlpha = 1;
    }

    if (game.boss && !game.boss.defeated) {
      ctx.fillStyle = 'rgba(36, 8, 28, .58)';
      roundRect(440, 164, 400, 38, 16, true);
      ctx.fillStyle = '#ffd36a';
      ctx.font = '900 18px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText('堵车怪挡路中：撒喜糖开路！', 518, 189);
    }
    ctx.restore();
  }

  function drawDebugHitboxes() {
    ctx.save();
    ctx.strokeStyle = 'lime';
    drawRect(playerHitbox());
    for (const e of game.entities) drawRect(entityHitbox(e));
    if (game.boss) drawRect(bossHitbox());
    ctx.restore();
  }

  function drawRect(rect) { ctx.strokeRect(rect.x, rect.y, rect.w, rect.h); }

  const trimmedFrameCache = Object.create(null);
  function trimmedFrame(name, frame) {
    const image = img(name);
    if (!image) return frame;
    const key = `${name}:${frame.sx},${frame.sy},${frame.sw},${frame.sh}`;
    if (trimmedFrameCache[key]) return trimmedFrameCache[key];
    const scan = document.createElement('canvas');
    scan.width = frame.sw;
    scan.height = frame.sh;
    const scanCtx = scan.getContext('2d');
    scanCtx.drawImage(image, frame.sx, frame.sy, frame.sw, frame.sh, 0, 0, frame.sw, frame.sh);
    const data = scanCtx.getImageData(0, 0, frame.sw, frame.sh).data;
    let minX = frame.sw, minY = frame.sh, maxX = -1, maxY = -1;
    for (let y = 0; y < frame.sh; y++) {
      for (let x = 0; x < frame.sw; x++) {
        if (data[(y * frame.sw + x) * 4 + 3] < 12) continue;
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x);
        maxY = Math.max(maxY, y);
      }
    }
    if (maxX < 0) return frame;
    trimmedFrameCache[key] = r(frame.sx + minX, frame.sy + minY, maxX - minX + 1, maxY - minY + 1);
    return trimmedFrameCache[key];
  }

  function drawSingle(name, rect, dx, dy, dw, dh) {
    const image = img(name);
    if (!image) {
      ctx.fillStyle = '#ff75a8';
      roundRect(dx, dy, dw, dh, 8, true);
      return;
    }
    ctx.drawImage(image, rect.sx, rect.sy, rect.sw, rect.sh, dx, dy, dw, dh);
  }

  function drawFrame(name, frame, dx, dy, dw, dh) {
    const image = img(name);
    if (!image) {
      ctx.fillStyle = name === 'groom' ? '#ffffff' : '#ff4d6d';
      roundRect(dx, dy, dw, dh, 10, true);
      return;
    }
    ctx.drawImage(image, frame.sx, frame.sy, frame.sw, frame.sh, dx, dy, dw, dh);
  }

  function drawImageCover(image, x, y, w, h) {
    const scale = Math.max(w / image.width, h / image.height);
    const sw = w / scale;
    const sh = h / scale;
    const sx = (image.width - sw) / 2;
    const sy = (image.height - sh) / 2;
    ctx.drawImage(image, sx, sy, sw, sh, x, y, w, h);
  }

  function drawVignette(alpha) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 180, W / 2, H / 2, 780);
    g.addColorStop(0, `rgba(0,0,0,0)`);
    g.addColorStop(1, `rgba(20, 3, 15, ${alpha})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function roundRect(x, y, w, h, radius, fill) {
    const r = Math.min(radius, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) ctx.fill();
    else ctx.stroke();
  }

  function loop(now) {
    const dt = Math.min((now - (game.lastTime || now)) / 1000, 0.033);
    game.lastTime = now;
    update(dt);
    render();
    if (game.mode === 'loading') updateOverlay();
    requestAnimationFrame(loop);
  }

  window.addEventListener('blur', () => {
    if (game.mode === 'playing') setMode('paused');
  });

  loadAssets();
  updateOverlay();
  requestAnimationFrame(loop);
})();
</script>
</body>
